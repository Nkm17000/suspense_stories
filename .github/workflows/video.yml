name: Generate Long Story Video

on:
  workflow_dispatch:

  schedule:
    # Once per day: 02:00 UTC / 07:30 IST.
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: suspense-story-generator
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      # Cloudflare account rotation. Add more numbered pairs if needed.
      CLOUDFLARE_ACCOUNT_COUNT: "5"
      CLOUDFLARE_ACCOUNT_SWITCH_THRESHOLD: "8500"
      CLOUDFLARE_ACCOUNT_ID_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_1 }}
      CLOUDFLARE_API_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN_1 }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      CLOUDFLARE_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
      CLOUDFLARE_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
      CLOUDFLARE_ACCOUNT_ID_4: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_4 }}
      CLOUDFLARE_API_TOKEN_4: ${{ secrets.CLOUDFLARE_API_TOKEN_4 }}
      CLOUDFLARE_ACCOUNT_ID_5: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_5 }}
      CLOUDFLARE_API_TOKEN_5: ${{ secrets.CLOUDFLARE_API_TOKEN_5 }}
      CLOUDFLARE_USAGE_COLLECTION: "cloudflare_daily_usage"
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v23.0
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CLOUDFLARE_IMAGE_STEPS: "1"
      CLOUDFLARE_IMAGE_RETRIES: "2"
      CLOUDFLARE_IMAGE_TIMEOUT: "120"

      CTA_URL: "https://www.facebook.com/thesmartlearninglab"

      LOGO_PATH: "logo.png"
      LOGO_SIZE: "125"
      LOGO_MARGIN: "18"

      END_CARD_DURATION: "5"
      TITLE_CARD_DURATION: "2"
      TITLE_TEMPLATE_PATH: "assets/title_page_template.png"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Verify Python
        run: |
          python --version
          python -m pip --version
          pwd

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f -v

      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -5
          ffprobe -version | head -5

      - name: Verify Hindi fonts
        run: |
          fc-list :lang=hi family file | head -30
          find /usr/share/fonts -iname "*Devanagari*" | head -30

      - name: Verify project structure
        run: |
          pwd
          ls -lah
          find . -maxdepth 3 -type f -name "*.py" -print | sort
          ls -lah smart_video
          ls -lah assets

      - name: Verify logo
        run: |
          test -f "$LOGO_PATH"
          ls -lh "$LOGO_PATH"

      - name: Verify title page template
        run: |
          test -f "$TITLE_TEMPLATE_PATH"
          ls -lh "$TITLE_TEMPLATE_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python packages
        run: |
          python - <<'PY'
          import edge_tts, pymongo, requests, numpy, nest_asyncio, PIL, moviepy, qrcode
          print("edge_tts     : OK")
          print("pymongo      : OK")
          print("requests     : OK")
          print("numpy        : OK")
          print("nest_asyncio : OK")
          print("Pillow       :", PIL.__version__)
          print("MoviePy      :", moviepy.__version__)
          print("qrcode       : OK")
          PY

      - name: Test Hindi TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              communicate = edge_tts.Communicate(
                  text="एक विशाल पहाड़ी जंगल में अर्जुन नाम का एक लकड़हारा रहता था।",
                  voice="hi-IN-SwaraNeural",
                  rate="-15%",
              )
              await communicate.save("test_hindi.mp3")

          asyncio.run(main())
          PY
          test -s test_hindi.mp3

      - name: Test English TTS
        run: |
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              communicate = edge_tts.Communicate(
                  text="Deep inside a vast mountain forest, Arjun lived in a small cabin.",
                  voice="en-IN-NeerjaNeural",
                  rate="-15%",
              )
              await communicate.save("test_english.mp3")

          asyncio.run(main())
          PY
          test -s test_english.mp3

      - name: Validate MongoDB URI
        run: |
          test -n "$MONGODB_URI"

      - name: Validate Facebook credentials
        run: |
          test -n "$FB_PAGE_ID"
          test -n "$FB_PAGE_ACCESS_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID_1"
          test -n "$CLOUDFLARE_API_TOKEN_1"
          test -n "$INSTAGRAM_BUSINESS_ACCOUNT_ID"
          test -n "$INSTAGRAM_ACCESS_TOKEN"

      - name: Validate title configuration
        run: |
          test -f "$TITLE_TEMPLATE_PATH"
          echo "TITLE_TEMPLATE_PATH=$TITLE_TEMPLATE_PATH"
          echo "TITLE_CARD_DURATION=$TITLE_CARD_DURATION"

      - name: Validate Python source
        run: |
          python -m compileall -q .
          echo "Python syntax validation passed"

      - name: Run Long Story Generator
        run: |
          echo "=========================================="
          echo "Starting suspense-story generator"
          echo "Scheduler: once per day; manual workflow_dispatch: runs immediately"
          echo "Only story parts with status=PENDING will be executed"
          echo "Cloudflare account rotation threshold: 8500 neurons/account/day"
          echo "=========================================="
          python main.py

      - name: Verify generated part videos
        if: always()
        run: |
          echo "Generated MP4 files:"
          find parts -type f -name "*.mp4" -print 2>/dev/null | sort || true

          echo "Part directories:"
          find parts -maxdepth 2 -type d -print 2>/dev/null | sort || true

      - name: Upload part videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-part-videos
          path: parts/**/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-long-story-assets
          path: |
            parts/**/images/**
            parts/**/audio/**
            parts/**/title_card.png
            test_hindi.mp3
            test_english.mp3
          if-no-files-found: warn
          retention-days: 7
